<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    main { max-width: 700px; margin: 30px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 2px 10px #0000001a; }
    h1 { text-align: center; font-size: 24px; color: #333; }
    h2 { font-size: 18px; color: #444; margin-top: 24px; }
    label { display: block; margin: 14px 0 5px; font-size: 14px; color: #555; }
    input { width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
    button { padding: 9px 14px; border: 0; border-radius: 4px; background: #4a90d9; color: white; cursor: pointer; font: inherit; font-size: 14px; }
    button:hover { background: #357ab8; }
    button:disabled { opacity: .6; cursor: wait; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .secondary { background: #666; }
    .delete { background: #d93636; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #4a90d9; color: white; text-align: left; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; overflow-wrap: anywhere; }
    td:last-child { min-width: 140px; }
    td button { margin: 2px; padding: 6px 10px; font-size: 12px; }
    #status, #mode { font-size: 14px; line-height: 1.5; }
    #status { color: #245ca0; }
    #status.error { color: #b42318; }
    [hidden] { display: none !important; }
    @media(max-width: 500px) { body { padding: 12px; } main { margin: 12px auto; padding: 18px; } }
  </style>
</head>
<body>
  <main>
    <h1>Student Management</h1>
    <p id="mode"></p>
    <h2 id="form-title">Add Student</h2>
    <form id="student-form">
      <label for="name">Student Name</label>
      <input id="name" name="name" required maxlength="100" placeholder="Enter student name">
      <label for="rollNumber">Roll Number</label>
      <input id="rollNumber" name="rollNumber" required maxlength="30" placeholder="Enter roll number">
      <label for="department">Department</label>
      <input id="department" name="department" required maxlength="80" placeholder="e.g. IT, Computer Science">
      <label for="marks">Marks</label>
      <input id="marks" name="marks" type="number" min="0" max="100" step="0.01" required placeholder="Enter marks">
      <div class="actions">
        <button type="submit" id="save">Add Student</button>
        <button type="button" id="cancel" class="secondary" hidden>Cancel</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <h2>Student Records</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Roll No.</th><th>Department</th><th>Marks</th><th>Actions</th></tr></thead>
        <tbody id="students"></tbody>
      </table>
    </div>
  </main>
  <script>
    // GitHub Pages is a static preview. npm start uses the real /students API.
    const demo = location.hostname.endsWith('.github.io') || location.protocol === 'file:';
    let students = demo ? [
      { _id: 'sample-1', name: 'Aarav Patil', rollNumber: '12', department: 'IT', marks: 85 },
      { _id: 'sample-2', name: 'Ananya Deshmukh', rollNumber: '24', department: 'Computer Engineering', marks: 92 }
    ] : [];
    let editing = null;
    const form = document.querySelector('#student-form');
    const list = document.querySelector('#students');
    const status = document.querySelector('#status');
    document.querySelector('#mode').textContent = demo
      ? 'Sample preview. Changes reset when you refresh the page.'
      : 'Add and manage student records saved in MongoDB.';

    function message(text, error = false) {
      status.textContent = text;
      status.classList.toggle('error', error);
    }
    async function request(url, method = 'GET', data) {
      const response = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: data ? JSON.stringify(data) : undefined,
        signal: AbortSignal.timeout(15000)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Request failed.');
      return result;
    }
    function resetForm() {
      editing = null;
      form.reset();
      document.querySelector('#form-title').textContent = 'Add Student';
      document.querySelector('#save').textContent = 'Add Student';
      document.querySelector('#cancel').hidden = true;
    }
    function render() {
      list.replaceChildren();
      if (!students.length) {
        const cell = list.insertRow().insertCell();
        cell.colSpan = 5;
        cell.textContent = 'No students added yet.';
      }
      for (const student of students) {
        const row = list.insertRow();
        for (const key of ['name', 'rollNumber', 'department', 'marks']) row.insertCell().textContent = student[key];
        const actions = row.insertCell();
        const edit = document.createElement('button');
        edit.type = 'button'; edit.textContent = 'Edit';
        edit.onclick = () => {
          editing = student._id;
          for (const key of ['name', 'rollNumber', 'department', 'marks']) form.elements[key].value = student[key];
          document.querySelector('#form-title').textContent = 'Edit Student';
          document.querySelector('#save').textContent = 'Save Changes';
          document.querySelector('#cancel').hidden = false;
          form.elements.name.focus();
        };
        const remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'delete'; remove.textContent = 'Delete';
        remove.onclick = async () => {
          remove.disabled = true;
          try {
            if (demo) students = students.filter(item => item._id !== student._id);
            else await request('/students/' + student._id, 'DELETE');
            if (editing === student._id) resetForm();
            await load(); message('Student deleted successfully.');
          } catch (error) { message(error.message, true); }
          finally { remove.disabled = false; }
        };
        actions.append(edit, remove);
      }
    }
    async function load() {
      if (!demo) students = await request('/students');
      render();
    }
    form.onsubmit = async event => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      for (const key of ['name', 'rollNumber', 'department']) {
        data[key] = data[key].trim();
        if (!data[key]) { message('Please fill in all fields.', true); return; }
      }
      data.marks = Number(data.marks);
      document.querySelector('#save').disabled = true;
      try {
        const updated = Boolean(editing);
        if (demo) {
          if (editing) students = students.map(item => item._id === editing ? { ...item, ...data } : item);
          else students.push({ _id: crypto.randomUUID(), ...data });
        } else await request('/students' + (editing ? '/' + editing : ''), editing ? 'PUT' : 'POST', data);
        resetForm(); await load();
        message(updated ? 'Student updated successfully.' : 'Student added successfully.');
      } catch (error) { message(error.message, true); }
      finally { document.querySelector('#save').disabled = false; }
    };
    document.querySelector('#cancel').onclick = resetForm;
    load().catch(() => message('Could not load students. Start MongoDB and run npm start, then refresh.', true));
  </script>
</body>
</html>
