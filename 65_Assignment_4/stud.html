<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Student Result Management</h1>

    <!-- Step 1 -->
    <div class="form-box" id="studentSection">

      <div class="input-group">
        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter student name">
      </div>

      <div class="input-group">
        <label>Roll Number</label>
        <input type="text" id="roll" placeholder="Enter roll number">
      </div>

      <button type="button" onclick="showMarksSection()">Next</button>

    </div>

    <!-- Step 2 -->
    <div class="form-box hidden" id="marksSection">

      <div class="input-group">
        <label>Subject 1</label>
        <input type="number" id="m1" placeholder="Marks">
      </div>

      <div class="input-group">
        <label>Subject 2</label>
        <input type="number" id="m2" placeholder="Marks">
      </div>

      <div class="input-group">
        <label>Subject 3</label>
        <input type="number" id="m3" placeholder="Marks">
      </div>

      <div class="input-group">
        <label>Subject 4</label>
        <input type="number" id="m4" placeholder="Marks">
      </div>

      <div class="input-group">
        <label>Subject 5</label>
        <input type="number" id="m5" placeholder="Marks">
      </div>

      <button type="button" onclick="addStudent()">Add Student</button>

    </div>

    <h2 id="topper">Topper : None</h2>

    <div class="table-box">

      <table>

        <thead>
          <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Total</th>
            <th>Percentage</th>
            <th>Grade</th>
            <th>Result</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
